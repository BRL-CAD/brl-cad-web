worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;

    root /usr/local/www/brl-cad-web;
    index index.html;

    # The export uses trailing slashes: /repositories/ -> repositories/index.html
    location / {
      try_files $uri $uri/ =404;
    }

    # File names under _next/static contain a content hash, so they never change.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # mime.types has no entry for Markdown; show the gallery's notes as text
    location ~ \.md$ {
      types { }
      default_type "text/plain; charset=utf-8";
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
